.fl b{position:absolute;top:4px;inset-inline-end:5px;font-size:.7rem;font-weight:500;color:#aebdc6}

.bd{padding:0 16px 16px}

.bg.L{background:var(--am);color:#0c1418}
.dl{margin-top:8px;border-inline-start:3px solid var(--am);padding:2px 10px;font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}

.wn{border-inline-start:4px solid var(--am)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</head>

const sd=i=>st.start?new Date(new Date(st.start).getTime()+i*14*DAY):null;
const prog=a=>{const d=a.filter(t=>st.done[t.id]).length;return[d,a.length,a.length?Math.round(d/a.length*100):0]};
const curS=()=>{if(!st.start)return-1;return Math.floor((Date.now()-new Date(st.start))/DAY/14)};

function hero(){
 const f=[...Array(8)].map((_,i)=>`<div class="fl" style="inset-inline-start:${i*12.5}%"><b>س${i+1}</b></div>`).join("");
 $("#road").innerHTML=f+`<div class="fin"></div><svg id="car" viewBox="0 0 56 44" aria-hidden="true"><rect x="6" y="14" width="40" height="16" rx="6" fill="#3cc9c0"/><rect x="18" y="6" width="18" height="12" rx="5" fill="#e6eef1"/><circle cx="10" cy="32" r="8" fill="#0b1217" stroke="#9fb3bd" stroke-width="2"/><circle cx="42" cy="32" r="8" fill="#0b1217" stroke="#9fb3bd" stroke-width="2"/><rect x="46" y="18" width="8" height="5" rx="2" fill="#f0b429"/></svg>`;
}
function upd(){
 const[d,n,p]=prog(T);
 $("#pct").textContent=p;$("#cnt").textContent=`(${d} من ${n} مهمة)`;
 $("#car").style.insetInlineStart=`calc(${Math.min(p,100)}% - ${p/100*56}px)`;
 $("#rem").textContent=n-d;
 const c=curS();
 $("#cur").textContent=!st.start?"حدد تاريخ البداية":c<0?"لسه ما بدأ":c>7?"انتهت المدة":`س${c+1}: ${S[c].t}`;
 $("#left").textContent=!st.start?"-":Math.max(0,Math.ceil((new Date(st.start).getTime()+112*DAY-Date.now())/DAY))+" يوم";
 let tot=0;Object.values(st.bom).forEach(b=>tot+=+b.p||0);$("#bud").textContent=tot.toLocaleString("ar-EG")+" جنيه";
 S.forEach((s,i)=>{const e=$("#sp"+i);if(e){const[a,b,q]=prog(T.filter(t=>t.s==i));e.style.width=q+"%";$("#spt"+i).textContent=`${a}/${b}`}});
 Object.keys(M).forEach(m=>{const e=$("#tm"+m);if(e){const[a,b,q]=prog(T.filter(t=>t.m==m));e.style.width=q+"%";$("#tmt"+m).textContent=`${a}/${b}`}});
}
const task=t=>`<label class="tk ${st.done[t.id]?"dn":""}"><input type="checkbox" data-t="${t.id}" ${st.done[t.id]?"checked":""}><span class="bg ${t.m=="L"?"L":""}">${nm(t.m)}</span><span>${t.t}</span></label>`;
function vSp(){
 const c=curS();
 return `<div class="chips">${["all",...Object.keys(M)].map(m=>`<button class="chip" data-f="${m}" aria-pressed="${st.flt==m}">${m=="all"?"الكل":nm(m)}</button>`).join("")}</div>`+
 S.map((s,i)=>{const ts=T.filter(t=>t.s==i&&(st.flt=="all"||t.m==st.flt));const d=sd(i);
 if(!ts.length)return"";
 return `<details class="${c==i?"cur":""}" ${c==i||(c<0&&i==0&&st.flt=="all")?"open":""}><summary><span class="no">${i+1}</span><span><div class="ttl">${s.t}${c==i?" (الحالي)":""}</div><div class="dt">أسبوع ${i*2+1}-${i*2+2}${d?" | "+fd(d)+" إلى "+fd(new Date(d.getTime()+13*DAY)):""}</div></span><span><div class="bar"><i id="sp${i}"></i></div><div class="dt" id="spt${i}" style="text-align:center"></div></span></summary><div class="bd"><div class="goal">الهدف: ${s.g}</div>${ts.map(task).join("")}<div class="dl"><b>التسليم:</b> ${s.d}</div></div></details>`}).join("");
}
const vTm=()=>`<div class="grid">${Object.keys(M).map(m=>`<div class="card"><h3>${m}: <input class="nm" data-n="${m}" value="${esc(st.names[m]||"")}" placeholder="اكتب الاسم" aria-label="اسم ${m}" size="14"></h3><div class="rl">${M[m][0]}. ${M[m][1]}</div><div class="bar"><i id="tm${m}"></i></div><div class="dt" id="tmt${m}"></div><ul>${T.filter(t=>t.m==m).map(t=>`<li><input type="checkbox" data-t="${t.id}" ${st.done[t.id]?"checked":""} style="accent-color:var(--ac)"><span><b>س${t.s+1}</b> ${t.t}</span></li>`).join("")}</ul></div>`).join("")}</div>`;
const vBm=()=>`<div class="sc"><table class="tb"><tr><th>تم</th><th>البند</th><th>المسؤول</th><th>السعر (جنيه)</th></tr>${B.map((b,i)=>{const x=st.bom[i]||{};return `<tr><td><input type="checkbox" data-b="${i}" ${x.c?"checked":""} style="accent-color:var(--ac)" aria-label="تم شراء ${b[0]}"></td><td>${b[0]}</td><td>${nm(b[1])}</td><td><input type="number" min="0" data-p="${i}" value="${x.p||""}" style="width:110px" aria-label="سعر ${b[0]}"></td></tr>`}).join("")}</table></div><div class="tot"><span>إجمالي المسجل: <span id="t1"></span></span><span>اللي اتشترى فعلاً: <span id="t2"></span></span></div>`;
const vNt=()=>`<div class="grid">${N.map(n=>`<div class="card wn"><h3>${n[0]}</h3><p style="margin:4px 0 0">${n[1]}</p></div>`).join("")}</div>`;
function bt(){let a=0,b=0;B.forEach((_,i)=>{const x=st.bom[i]||{};a+=+x.p||0;if(x.c)b+=+x.p||0});if($("#t1")){$("#t1").textContent=a.toLocaleString("ar-EG")+" جنيه";$("#t2").textContent=b.toLocaleString("ar-EG")+" جنيه"}}
function view(){$("#view").innerHTML={sp:vSp,tm:vTm,bm:vBm,nt:vNt}[st.tab]();document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab==st.tab));upd();bt()}
document.addEventListener("click",e=>{const t=e.target;
 if(t.dataset.tab){st.tab=t.dataset.tab;save();view()}
 if(t.dataset.f){st.flt=t.dataset.f;save();view()}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.t){st.done[t.dataset.t]=t.checked;if(!t.checked)delete st.done[t.dataset.t];t.closest(".tk")&&t.closest(".tk").classList.toggle("dn",t.checked);save();upd()}
 if(t.dataset.b){(st.bom[t.dataset.b]=st.bom[t.dataset.b]||{}).c=t.checked;save();bt()}
 if(t.id=="start"){st.start=t.value;save();view()}});
document.addEventListener("input",e=>{const t=e.target;
 if(t.dataset.p){(st.bom[t.dataset.p]=st.bom[t.dataset.p]||{}).p=t.value;save();upd();bt()}
 if(t.dataset.n){st.names[t.dataset.n]=t.value;save()}});
$("#rs").onclick=()=>{if(confirm("تمسح كل المهام والأسماء والأسعار؟")){try{localStorage.removeItem("evhub1")}catch(e){}st={done:{},names:{},start:"",bom:{},tab:"sp",flt:"all"};$("#start").value="";view()}};
$("#start").value=st.start;hero();view();
</script>
</body>
</html>
